<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#0b1118"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f7fa"><text x="80" y="90" font-size="28" letter-spacing="12">JAVA + SPRING BOOT</text><rect x="80" y="112" width="125" height="6" fill="#8be36b"/><text x="80" y="195" font-size="64" font-weight="700">What is <tspan fill="#8be36b">Spring Boot</tspan></text><text x="80" y="265" font-size="64" font-weight="700">and Why It Matters?</text><text x="80" y="335" font-size="26" fill="#c8d2df">Spring Boot makes building production-ready</text><text x="80" y="372" font-size="26" fill="#c8d2df">Java applications faster, simpler, and more efficient.</text><text x="80" y="450" font-size="20" letter-spacing="5">KEY BENEFITS</text><text x="115" y="520" font-size="30" font-weight="700">Fast Development</text><text x="115" y="555" font-size="20" fill="#c8d2df">Auto-configuration reduces boilerplate code.</text><text x="115" y="630" font-size="30" font-weight="700">Production Ready</text><text x="115" y="665" font-size="20" fill="#c8d2df">Health checks, metrics, and externalized config.</text><text x="115" y="740" font-size="30" font-weight="700">Microservices Friendly</text><text x="115" y="775" font-size="20" fill="#c8d2df">Build scalable and independent services.</text><rect x="820" y="150" width="560" height="120" rx="18" fill="none" stroke="#607080" stroke-width="3"/><text x="880" y="215" font-size="34" font-weight="700">Client</text><text x="880" y="250" font-size="20" fill="#c8d2df">Web / Mobile / API</text><line x1="1100" y1="270" x2="1100" y2="330" stroke="#8be36b" stroke-width="4"/><polygon points="1100,350 1088,328 1112,328" fill="#8be36b"/><rect x="820" y="350" width="560" height="150" rx="18" fill="none" stroke="#8be36b" stroke-width="4"/><text x="880" y="420" font-size="38" font-weight="700">Spring Boot</text><text x="880" y="460" font-size="20" fill="#c8d2df">REST APIs | Business Logic | Security</text><line x1="1100" y1="500" x2="1100" y2="560" stroke="#8be36b" stroke-width="4"/><polygon points="1100,580 1088,558 1112,558" fill="#8be36b"/><rect x="820" y="580" width="560" height="120" rx="18" fill="none" stroke="#607080" stroke-width="3"/><text x="880" y="645" font-size="32" font-weight="700">Data Access Layer</text><text x="880" y="680" font-size="20" fill="#c8d2df">Spring Data JPA / JDBC</text><line x1="1100" y1="700" x2="1100" y2="760" stroke="#8be36b" stroke-width="4"/><polygon points="1100,780 1088,758 1112,758" fill="#8be36b"/><rect x="820" y="780" width="560" height="120" rx="18" fill="none" stroke="#607080" stroke-width="3"/><text x="880" y="845" font-size="34" font-weight="700">Database</text><text x="880" y="880" font-size="20" fill="#c8d2df">MySQL / PostgreSQL / MongoDB</text><text x="80" y="950" font-size="18" letter-spacing="5" fill="#a8b7c8">BETTER CODE / CLEANER ARCHITECTURE / STRONGER SYSTEMS</text></g></svg>
