<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#0b1118"/>
<g fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif">
<text x="72" y="72" font-size="24" letter-spacing="8">JAVA / BACKEND DEVELOPMENT / SOFTWARE ARCHITECTURE</text>
<text x="72" y="165" font-size="64" font-weight="700">Clear boundaries make</text>
<text x="72" y="235" font-size="64" font-weight="700">backend systems easier to change.</text>
<text x="72" y="305" font-size="28" fill="#c7d0dc">A typical Java request flow separates transport, business logic, persistence, and storage.</text>
</g>


<g fill="#4fe3a1" font-family="Arial, Helvetica, sans-serif">
<circle cx="110" cy="455" r="24"/><circle cx="110" cy="590" r="24"/><circle cx="110" cy="725" r="24"/><circle cx="110" cy="860" r="24"/>
<text x="110" y="463" font-size="22" text-anchor="middle" fill="#0b1118">1</text><text x="110" y="598" font-size="22" text-anchor="middle" fill="#0b1118">2</text><text x="110" y="733" font-size="22" text-anchor="middle" fill="#0b1118">3</text><text x="110" y="868" font-size="22" text-anchor="middle" fill="#0b1118">4</text>
</g>
<g fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif">
<text x="160" y="462" font-size="30" font-weight="700">Controller</text><text x="160" y="498" font-size="22" fill="#c7d0dc">Translates HTTP requests and delegates work.</text>
<text x="160" y="597" font-size="30" font-weight="700">Service</text><text x="160" y="633" font-size="22" fill="#c7d0dc">Owns business rules and use-case flow.</text>
<text x="160" y="732" font-size="30" font-weight="700">Repository</text><text x="160" y="768" font-size="22" fill="#c7d0dc">Keeps persistence logic in one place.</text>
<text x="160" y="867" font-size="30" font-weight="700">Database</text><text x="160" y="903" font-size="22" fill="#c7d0dc">Stores the system of record.</text>
</g>
<rect x="760" y="390" width="680" height="390" rx="18" fill="#101923" stroke="#2b3b4c" stroke-width="2"/>
<text x="800" y="445" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#4fe3a1">WHY IT MATTERS</text>
<text x="800" y="505" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f7fa">• Easier unit testing</text>
<text x="800" y="565" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f7fa">• Faster debugging</text>
<text x="800" y="625" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f7fa">• Safer changes</text>
<text x="800" y="685" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f7fa">• More modular growth</text>
<text x="72" y="980" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="5" fill="#9aa8b8">DILPAT RAI / SOFTWARE ENGINEER</text>
</svg>
